[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ralina",email = "seitovaralina1@gmail.com"}
]
readme = "README.md"
requires-python = "^3.13"
package-mode = false

dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-filter (>=25.2,<26.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "drf-spectacular-sidecar (>=2026.3.1,<2027.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-allauth (>=65.15.1,<66.0.0)",
    "dj-rest-auth[with-social] (>=7.2.0,<8.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "transformers (>=5.5.4,<6.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pika (>=1.3.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=6.2.0,<7.0.0)",
    "ipython (>=9.12.0,<10.0.0)"
]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch_cpu"}
