[project]
name = "recommendation-service"
version = "0.1.0"
description = "Personalized recommendations for travel excursions"
authors = [
    {name = "Ralina",email = "seitovaralina1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "redis (>=7.4.0,<8.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "aio-pika (>=9.6.2,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "implicit (>=0.7.2,<0.8.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
