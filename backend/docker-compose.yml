services:
    postgres:
        image: postgres:15
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - excursion_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        ports:
            - "${RABBITMQ_PORT}:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - excursion_network
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    main_service:
        build: ./main_service
        ports:
            - "8001:8000"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

    celery_worker:
        build: ./main_service
        command: celery -A config worker --loglevel=info
        depends_on:
            - postgres
            - rabbitmq
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

volumes:
    postgres_data:
    rabbitmq_data:

networks:
    excursion_network:
        driver: bridge
