services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-excursions}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-scripts:/docker-entrypoint-initdb.d
        networks:
            - excursion_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        networks:
            - excursion_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        command: redis-server --appendonly yes

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rabbitmq
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"
            - "15673:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - excursion_network
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    main_service:
        build: ./main_service
        container_name: main-service
        ports:
            - "${DJANGO_PORT:-8001}:8000"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
            interval: 30s
            timeout: 10s
            retries: 3

    django_celery_worker:
        build: ./main_service
        container_name: django_celery_worker
        command: celery -A config worker --loglevel=info
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

    django_celery_beat:
        build: ./main_service
        container_name: django_celery_beat
        command: celery -A config beat --loglevel=info
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

    recommender_api:
        build: ./recommendation_service
        container_name: recommender_api
        ports:
            - "${RECOMMENDER_PORT:-8002}:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./recommendation_service:/app
        networks:
            - excursion_network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3

    recommender_worker:
        build: ./recommendation_service
        container_name: recommender_worker
        command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./recommendation_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

    assistant_service:
        build: ../
        container_name: assistant-service
        ports:
            - "${ASSISTANT_PORT:-8000}:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            - DJANGO_SETTINGS_MODULE=config.settings
            - DB_NAME=${DB_NAME:-excursions}
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - DB_HOST=postgres
            - DB_PORT=5432
            - PYTHONUNBUFFERED=1
            - YANDEX_API_KEY=${YANDEX_API_KEY}
            - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
        volumes:
            - ../:/app
            - chroma_data:/app/chroma_data
        networks:
            - excursion_network
        restart: unless-stopped

    vectorizer_worker:
        build: ./vectorizer
        container_name: vectorizer-worker
        command: celery -A celery_app worker --loglevel=info -Q vectorizer
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            - DB_NAME=${DB_NAME:-excursions}
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - DB_HOST=postgres
            - DB_PORT=5432
            - PYTHONUNBUFFERED=1
            - YANDEX_API_KEY=${YANDEX_API_KEY}
            - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
        volumes:
            - ./vectorizer:/app
            - chroma_data:/app/chroma_data
        networks:
            - excursion_network
        restart: unless-stopped

    nginx:
        image: nginx:alpine
        profiles:
            - proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./nginx/ssl:/etc/nginx/ssl
        depends_on:
            - main_service
            - recommender_api
            - assistant_service
        networks:
            - excursion_network
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
    chroma_data:

networks:
    excursion_network:
        driver: bridge
