    main_service:
        build: ./main_service
        ports:
            - "8001:8000"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

    celery_worker:
        build: ./main_service
        command: celery -A config worker --loglevel=info
        depends_on:
            - postgres
            - rabbitmq
        env_file:
            - .env
        volumes:
            - ./main_service:/app
        networks:
            - excursion_network
        restart: unless-stopped

