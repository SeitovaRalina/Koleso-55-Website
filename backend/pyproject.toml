[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ralina",email = "seitovaralina1@gmail.com"}
]
readme = "README.md"
requires-python = "^3.13"
package-mode = false

dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-filter (>=25.2,<26.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "drf-spectacular-sidecar (>=2026.3.1,<2027.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=6.2.0,<7.0.0)",
    "ipython (>=9.12.0,<10.0.0)"
]
